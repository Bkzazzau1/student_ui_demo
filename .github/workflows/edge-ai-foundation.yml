name: Edge AI Foundation

on:
  pull_request:
    paths:
      - 'ai_runtime/**'
      - 'native/brain_core/**'
      - 'lib/proctoring_demo/live_camera_frame_bus.dart'
      - 'lib/proctoring_demo/monotonic_timebase.dart'
      - 'docs/edge_ai/**'
      - '.github/workflows/edge-ai-foundation.yml'
  push:
    branches:
      - 'edge-ai/**'
    paths:
      - 'ai_runtime/**'
      - 'native/brain_core/**'
      - 'lib/proctoring_demo/live_camera_frame_bus.dart'
      - 'lib/proctoring_demo/monotonic_timebase.dart'
      - 'docs/edge_ai/**'
      - '.github/workflows/edge-ai-foundation.yml'

permissions:
  contents: read

jobs:
  python-contract:
    name: Python Edge AI contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run AI runtime tests
        run: python -m unittest discover -s ai_runtime/tests -v

  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/brain_core/Cargo.toml -- --check

  rust-tests:
    name: Rust brain_core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run brain_core tests
        run: cargo test --manifest-path native/brain_core/Cargo.toml
