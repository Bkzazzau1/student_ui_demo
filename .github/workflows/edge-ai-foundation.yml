name: Edge AI Foundation

on:
  pull_request:
    paths:
      - 'ai_runtime/**'
      - 'native/brain_core/**'
      - 'lib/proctoring_demo/live_camera_frame_bus.dart'
      - 'lib/proctoring_demo/monotonic_timebase.dart'
      - 'docs/edge_ai/**'
      - '.github/workflows/edge-ai-foundation.yml'
  push:
    branches:
      - 'edge-ai/**'
    paths:
      - 'ai_runtime/**'
      - 'native/brain_core/**'
      - 'lib/proctoring_demo/live_camera_frame_bus.dart'
      - 'lib/proctoring_demo/monotonic_timebase.dart'
      - 'docs/edge_ai/**'
      - '.github/workflows/edge-ai-foundation.yml'

permissions:
  contents: read

jobs:
  python-contract:
    name: Python Edge AI contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run AI runtime tests
        run: python -m unittest discover -s ai_runtime/tests -v

  python-ml-numerical:
    name: Python E1 numerical tooling tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development-only numerical dependencies
        run: python -m pip install -r ai_runtime/requirements-e1-numerical.txt
      - name: Exercise synthetic ONNX graphs and tensor tooling
        run: python -m unittest ai_runtime.tests.test_e1_ml_numerical -v

  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check authored Rust formatting
        id: rustfmt_check
        continue-on-error: true
        shell: bash
        run: |
          rustfmt --edition 2024 --check \
            native/brain_core/src/api/model_event_memory.rs \
            native/brain_core/src/runtime/model_event.rs \
            native/brain_core/src/runtime/person_tracker.rs \
            native/brain_core/src/runtime/spatiotemporal_buffer.rs \
            native/brain_core/tests/model_event_tests.rs \
            native/brain_core/tests/spatiotemporal_buffer_tests.rs

      - name: Produce exact rustfmt patch
        if: steps.rustfmt_check.outcome == 'failure'
        shell: bash
        run: |
          rustfmt --edition 2024 \
            native/brain_core/src/api/model_event_memory.rs \
            native/brain_core/src/runtime/model_event.rs \
            native/brain_core/src/runtime/person_tracker.rs \
            native/brain_core/src/runtime/spatiotemporal_buffer.rs \
            native/brain_core/tests/model_event_tests.rs \
            native/brain_core/tests/spatiotemporal_buffer_tests.rs
          git diff -- \
            native/brain_core/src/api/model_event_memory.rs \
            native/brain_core/src/runtime/model_event.rs \
            native/brain_core/src/runtime/person_tracker.rs \
            native/brain_core/src/runtime/spatiotemporal_buffer.rs \
            native/brain_core/tests/model_event_tests.rs \
            native/brain_core/tests/spatiotemporal_buffer_tests.rs \
            > rustfmt.patch

      - name: Upload rustfmt patch
        if: steps.rustfmt_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 3

      - name: Fail when formatting differs
        if: steps.rustfmt_check.outcome == 'failure'
        run: exit 1

  rust-tests:
    name: Rust brain_core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Git LFS model assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run brain_core tests and capture output
        id: rust_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path native/brain_core/Cargo.toml 2>&1 | tee rust-tests.log

      - name: Upload Rust test log
        if: steps.rust_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-tests-log
          path: rust-tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when Rust tests fail
        if: steps.rust_tests.outcome == 'failure'
        run: exit 1
