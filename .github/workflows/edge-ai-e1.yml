name: Edge AI E1 Wiring

on:
  pull_request:
    paths:
      - 'assets/models/yolo_exam_review/**'
      - 'flutter_rust_bridge.yaml'
      - 'native/brain_core/src/api/**'
      - 'native/brain_core/src/frb_generated.rs'
      - 'lib/rust/**'
      - 'lib/proctoring_demo/e1_model_event_adapter.dart'
      - 'lib/proctoring_demo/model_event_v1.dart'
      - 'lib/proctoring_demo/optimized_vision_object_event_adapter.dart'
      - 'lib/proctoring_demo/optimized_vision_runtime_bridge.dart'
      - 'lib/proctoring_demo/yolo_exam_review_manifest.dart'
      - 'test/e1_model_event_adapter_test.dart'
      - 'test/model_event_v1_test.dart'
      - 'test/optimized_vision_object_event_adapter_test.dart'
      - '.github/workflows/edge-ai-e1.yml'
  push:
    branches:
      - 'edge-ai/e1-event-wiring'
    paths:
      - 'assets/models/yolo_exam_review/**'
      - 'flutter_rust_bridge.yaml'
      - 'native/brain_core/src/api/**'
      - 'native/brain_core/src/frb_generated.rs'
      - 'lib/rust/**'
      - 'lib/proctoring_demo/e1_model_event_adapter.dart'
      - 'lib/proctoring_demo/model_event_v1.dart'
      - 'lib/proctoring_demo/optimized_vision_object_event_adapter.dart'
      - 'lib/proctoring_demo/optimized_vision_runtime_bridge.dart'
      - 'lib/proctoring_demo/yolo_exam_review_manifest.dart'
      - 'test/e1_model_event_adapter_test.dart'
      - 'test/model_event_v1_test.dart'
      - 'test/optimized_vision_object_event_adapter_test.dart'
      - '.github/workflows/edge-ai-e1.yml'

permissions:
  contents: read

jobs:
  flutter-e1:
    name: Flutter E1 contract and adapter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run E1 contract and adapter tests
        run: >-
          flutter test
          test/model_event_v1_test.dart
          test/e1_model_event_adapter_test.dart
          test/optimized_vision_object_event_adapter_test.dart

  frb-codegen:
    name: Flutter Rust Bridge generated bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Install matching FRB generator
        run: cargo install flutter_rust_bridge_codegen --version 2.11.1 --locked

      - name: Generate bindings
        run: flutter_rust_bridge_codegen generate

      - name: Capture generated binding diff
        id: generated_diff
        shell: bash
        run: |
          git diff -- lib/rust native/brain_core/src/frb_generated.rs > frb-codegen.patch
          if [ -s frb-codegen.patch ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated binding patch
        if: steps.generated_diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frb-codegen-patch
          path: frb-codegen.patch
          if-no-files-found: error
          retention-days: 3

      - name: Require committed generated bindings
        if: steps.generated_diff.outputs.changed == 'true'
        run: exit 1
