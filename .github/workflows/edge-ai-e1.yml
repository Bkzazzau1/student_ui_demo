      - 'test/e1_small_object_specialist_manifest_test.dart'
      - 'test/e1_small_object_specialist_runtime_bridge_test.dart'
      - 'test/e1_specialist_execution_budget_test.dart'
      - 'test/e1_specialist_frame_contract_test.dart'
      - 'test/e1_specialist_model_event_adapter_test.dart'
      - 'test/e1_specialist_memory_ingress_test.dart'
      - 'test/model_event_v1_test.dart'
      - 'test/object_review_event_mapper_test.dart'
      - 'test/optimized_vision_object_event_adapter_test.dart'
      - '.github/workflows/edge-ai-e1.yml'

permissions:
  contents: read

jobs:
  flutter-e1:
    name: Flutter E1 contract and adapter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check E1 Dart formatting
        id: dartfmt
        continue-on-error: true
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/proctoring_demo/e1_model_event_memory_coordinator.dart
          lib/proctoring_demo/e1_small_object_cascade_coordinator.dart
          lib/proctoring_demo/e1_small_object_specialist.dart
          lib/proctoring_demo/e1_small_object_specialist_manifest.dart
          lib/proctoring_demo/e1_small_object_specialist_runtime_bridge.dart
          lib/proctoring_demo/e1_specialist_execution_budget.dart
          lib/proctoring_demo/live_camera_frame_bus.dart
          lib/proctoring_demo/optimized_vision_runtime_bridge.dart
          test/e1_small_object_cascade_coordinator_test.dart
          test/e1_small_object_specialist_test.dart
          test/e1_small_object_specialist_manifest_test.dart
          test/e1_small_object_specialist_runtime_bridge_test.dart
          test/e1_specialist_execution_budget_test.dart

      - name: Produce exact dartfmt patch
        if: steps.dartfmt.outcome == 'failure'
        shell: bash
        run: |
          dart format \
            lib/proctoring_demo/e1_model_event_memory_coordinator.dart \
            lib/proctoring_demo/e1_small_object_cascade_coordinator.dart \
            lib/proctoring_demo/e1_small_object_specialist.dart \
            lib/proctoring_demo/e1_small_object_specialist_manifest.dart \
            lib/proctoring_demo/e1_small_object_specialist_runtime_bridge.dart \
            lib/proctoring_demo/e1_specialist_execution_budget.dart \
            lib/proctoring_demo/live_camera_frame_bus.dart \
            lib/proctoring_demo/optimized_vision_runtime_bridge.dart \
            test/e1_small_object_cascade_coordinator_test.dart \
            test/e1_small_object_specialist_test.dart \
            test/e1_small_object_specialist_manifest_test.dart \
            test/e1_small_object_specialist_runtime_bridge_test.dart \
            test/e1_specialist_execution_budget_test.dart
          git diff -- \
            lib/proctoring_demo/e1_model_event_memory_coordinator.dart \
            lib/proctoring_demo/e1_small_object_cascade_coordinator.dart \
            lib/proctoring_demo/e1_small_object_specialist.dart \
            lib/proctoring_demo/e1_small_object_specialist_manifest.dart \
            lib/proctoring_demo/e1_small_object_specialist_runtime_bridge.dart \
            lib/proctoring_demo/e1_specialist_execution_budget.dart \
            lib/proctoring_demo/live_camera_frame_bus.dart \
            lib/proctoring_demo/optimized_vision_runtime_bridge.dart \
            test/e1_small_object_cascade_coordinator_test.dart \
            test/e1_small_object_specialist_test.dart \
            test/e1_small_object_specialist_manifest_test.dart \
            test/e1_small_object_specialist_runtime_bridge_test.dart \
            test/e1_specialist_execution_budget_test.dart \
            > dartfmt.patch

      - name: Upload dartfmt patch
        if: steps.dartfmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: e1-dartfmt-patch
          path: dartfmt.patch

      - name: Analyze E1 live cascade slice
        run: >-
          flutter analyze
          lib/proctoring_demo/e1_model_event_memory_coordinator.dart
          lib/proctoring_demo/e1_small_object_cascade_coordinator.dart
          lib/proctoring_demo/e1_small_object_specialist.dart
          lib/proctoring_demo/e1_small_object_specialist_manifest.dart
          lib/proctoring_demo/e1_small_object_specialist_runtime_bridge.dart
          lib/proctoring_demo/e1_specialist_execution_budget.dart
          lib/proctoring_demo/live_camera_frame_bus.dart
          lib/proctoring_demo/optimized_vision_runtime_bridge.dart
          test/e1_small_object_cascade_coordinator_test.dart
          test/e1_small_object_specialist_test.dart
          test/e1_small_object_specialist_manifest_test.dart
          test/e1_small_object_specialist_runtime_bridge_test.dart
          test/e1_specialist_execution_budget_test.dart

      - name: Run E1 contract and adapter tests
        run: >-
          flutter test
          test/brain_core_runtime_entrypoint_test.dart
          test/model_event_v1_test.dart
          test/e1_model_event_adapter_test.dart
          test/e1_model_event_memory_coordinator_test.dart
          test/e1_object_taxonomy_test.dart
          test/e1_object_taxonomy_manifest_alignment_test.dart
          test/e1_small_object_cascade_coordinator_test.dart
          test/e1_small_object_specialist_test.dart
          test/e1_small_object_specialist_compile_guard_test.dart
          test/e1_small_object_specialist_manifest_test.dart
          test/e1_small_object_specialist_runtime_bridge_test.dart
          test/e1_specialist_execution_budget_test.dart
          test/e1_specialist_frame_contract_test.dart
          test/e1_specialist_model_event_adapter_test.dart
          test/e1_specialist_memory_ingress_test.dart
          test/object_review_event_mapper_test.dart
          test/optimized_vision_object_event_adapter_test.dart

      - name: Fail when Dart formatting differs
        if: steps.dartfmt.outcome == 'failure'
        shell: bash
        run: exit 1

  windows-e1-native:
    name: Windows E1 native build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout with Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows debug app
        run: flutter build windows --debug
